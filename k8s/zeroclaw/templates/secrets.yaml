{{- if .Values.secrets.create }}
{{- $root := . }}
{{- $fullName := include "zeroclaw.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zeroclaw.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
type: Opaque
{{- if .Values.secrets.existingSecret }}
data:
  api_key: {{ .Values.secrets.existingSecret | b64enc }}
{{- else }}
stringData:
  api_key: {{ .Values.secrets.apiKey | quote }}
{{- end }}

{{- if and .Values.telegram.secretRef .Values.telegram.instances }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.telegram.secretRef.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zeroclaw.labels" $root | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
{{- range $index, $instance := .Values.telegram.instances }}
  bot_token_{{ $index }}: {{ $instance.botToken | default "" | quote }}
  allowed_users_{{ $index }}: {{ $instance.allowedUsers | default "*" | quote }}
{{- end }}
{{- end }}
{{- end }}
